run_name: mnist_cnn
seed: 42
device: cpu

dataset:
  name: mnist
  root: data
  batch_size: 128
  num_workers: 0

model:
  name: simple_cnn
  widths: [32, 64]

training:
  epochs: 3
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0
  log_every: 200

benchmark:
  runs: 200
  warmup_runs: 20
  batch_size: 64
  device: cpu

quantization:
  methods: [fp32, fp16, dynamic_int8, static_int8, qat_int8]
  backend: auto
  qconfig: per_channel
  calib_batches: 32
  qat_epochs: 1
  qat_lr: 0.001
